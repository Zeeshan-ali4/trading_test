[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quant-osint"
version = "0.1.0"
description = "Reproducible point-in-time quantitative OSINT research platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "polars>=1.0,<2",
  "pyarrow>=25.0.1",
]

[project.scripts]
quant = "quant_osint.cli:main"
quant-osint = "quant_osint.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quant_osint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
